name: Bootstrap npm lockfile

on:
  push:
    branches:
      - feature/initialize-next-stars-align
    paths:
      - package.json
      - .github/workflows/bootstrap-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: feature/initialize-next-stars-align

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: generate npm lockfile"
          git pull --rebase origin feature/initialize-next-stars-align
          git push
