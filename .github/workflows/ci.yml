name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: next-stars-align-main
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/stars_align
      SESSION_SECRET: ci-only-stars-align-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Build standalone app
        run: npm run build

      - name: Assemble deployment artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

          tar             --exclude='.next/cache'             -czf "next-stars-align-${GITHUB_SHA}.tar.gz"             -C .next/standalone .

          sha256sum "next-stars-align-${GITHUB_SHA}.tar.gz"             > "next-stars-align-${GITHUB_SHA}.sha256"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-stars-align-${{ github.sha }}
          path: |
            next-stars-align-${{ github.sha }}.tar.gz
            next-stars-align-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 14
